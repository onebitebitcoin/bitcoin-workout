name: "CI"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "mobile/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "mobile/**"
      - "**.md"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: "System deps for mediapipe (운동열 필터)"
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0 libgomp1

      - name: "Install dependencies"
        run: |
          pip install -r requirements.txt
          pip install --no-deps mediapipe==0.10.35

      - name: "Ruff lint"
        run: ruff check app/ tests/

      - name: "Pytest"
        run: pytest tests/ -q
        env:
          DATABASE_URL: "sqlite:///./test.db"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "Install dependencies"
        run: npm ci

      - name: "Lint"
        run: npm run lint

      - name: "Test"
        run: npm run test:coverage

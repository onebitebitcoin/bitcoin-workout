<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0D0D0D"/>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(280 315) rotate(90) scale(320 320)">
    <stop stop-color="#F7931A" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#F7931A" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 로고: LogoMark.tsx와 동일한 Coin Play 마크, 왼쪽 배치 -->
  <g transform="translate(130 205) scale(4.5833)">
    <mask id="coin-play-hole">
      <rect x="0" y="0" width="48" height="48" fill="white"/>
      <path d="M21.6 19.6L21.6 28.4L29.4 24Z" fill="black" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    </mask>
    <rect x="18.2" y="2.8" width="3.6" height="9.4" rx="1.4" fill="#F7931A"/>
    <rect x="26.2" y="2.8" width="3.6" height="9.4" rx="1.4" fill="#F7931A"/>
    <rect x="18.2" y="35.8" width="3.6" height="9.4" rx="1.4" fill="#F7931A"/>
    <rect x="26.2" y="35.8" width="3.6" height="9.4" rx="1.4" fill="#F7931A"/>
    <circle cx="24" cy="24" r="15.2" fill="#F7931A" mask="url(#coin-play-hole)"/>
  </g>

  <!-- Bitcoiners 워드마크 -->
  <text
    x="420" y="300"
    fill="#F5F5F5"
    font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif"
    font-size="96"
    font-weight="800"
    letter-spacing="-2"
  >Bitcoiners</text>

  <!-- 태그라인 -->
  <text
    x="422" y="352"
    fill="#9CA3AF"
    font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif"
    font-size="32"
    font-weight="500"
  >비트코이너는 뭐하고 사나</text>

  <!-- 도메인 -->
  <text
    x="422" y="560"
    fill="#6B7280"
    font-family="Inter, Pretendard, Apple SD Gothic Neo, sans-serif"
    font-size="22"
    font-weight="500"
    letter-spacing="0.5"
  >bitcoiners.life</text>
</svg>

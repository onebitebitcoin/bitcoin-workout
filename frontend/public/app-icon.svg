  <rect x="18.2" y="2.8" width="3.6" height="9.4" rx="1.4" fill="#FFFFFF"/>
  <rect x="26.2" y="2.8" width="3.6" height="9.4" rx="1.4" fill="#FFFFFF"/>
  <!-- Bottom ticks -->
  <rect x="18.2" y="35.8" width="3.6" height="9.4" rx="1.4" fill="#FFFFFF"/>
  <rect x="26.2" y="35.8" width="3.6" height="9.4" rx="1.4" fill="#FFFFFF"/>
  <!-- Coin with play-triangle cutout revealing tile background -->
  <circle cx="24" cy="24" r="15.2" fill="#FFFFFF" mask="url(#coin-play-hole)"/>
